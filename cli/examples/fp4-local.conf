# Current FP4-Local profile. Copy and replace every local path and ssh destination.
# ssh: what you would type after ssh, e.g. you@host-or-ipv4, or a ~/.ssh/config alias.
# Start: vade up
# Use absolute checkpoint paths already verified by docs/INSTALL.md step 3.
# vade install builds/stages code; it does not download these weights.
[global]
engine_source = /path/to/vade/engine
harness_source = /path/to/vade/harness
cli_source = /path/to/vade/cli
# With no checkout, on a Spark with the one-line install: source = installed-bundle
# in place of the three lines above. vade setup writes that line for you.
# Optional trusted exact-source bundles, including host tools; layout in cli/docs/prebuilt.md.
# prebuilt_dir = /path/to/prebuilt-bundles
stage_dir = /path/to/local/vade-bin
# Private ownership and relative SSH control socket live here.
state_dir = ~/.vade-state
model = qwen3.8-flash-next-fp4-local
model_repo = nvidia/Qwen3.8-Flash-Next-FP4-Local
# Qualified immutable publisher revision; full-file manifest and fetch command in docs/INSTALL.md step 3.
model_revision = b9ce18a6887e18c089fdea8509a33e63429a3300
local_port = 18080
serve_port = 18080
tp_port = 29960
health_timeout_secs = 360

[machine spark-a]
ssh = spark-a-ssh-alias
model_path = /home/your-user/models/nvidia/Qwen3.8-Flash-Next-FP4-Local
engine_source = ~/vade-source
cli_source = ~/vade-cli-source
stage_dir = ~/vade-stage
state_dir = ~/.local/state/vade

# To use the two-Spark tensor split, add the second machine below, uncomment
# the fabric entry under spark-a, and run: vade up --fp4-local --sparks 2
# Both Sparks work on every token. The split needs RDMA; vade up refuses
# SEQPAR_RDMA=0 (TCP) on two FP4-Local Sparks.
# fabric.spark-b = spark-a-own-link-address
#
# [machine spark-b]
# ssh = spark-b-ssh-alias
# fabric.spark-a = spark-b-own-link-address
# model_path = /home/your-user/models/nvidia/Qwen3.8-Flash-Next-FP4-Local
# engine_source = ~/vade-source
# cli_source = ~/vade-cli-source
# stage_dir = ~/vade-stage
# state_dir = ~/.local/state/vade

# Larger chains: add up to 24 machines, with both ends of every adjacent link.
# Select cable order with --hosts spark-a,spark-b,spark-c,... (no closing cable).
# Run vade install from current source before selecting more than two Sparks.
# Each larger topology still requires live GPU exactness qualification.
