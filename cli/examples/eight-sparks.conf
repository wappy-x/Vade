# Eight FP4-Local Sparks, cabled as one ring of eight (docs/eight-sparks.md).
# Copy it to a private file, replace every path and ssh destination, and set
# VADE_CONFIG to that file.
# fabric.<peer> is this Spark's own rail 0 address on the cable to <peer>.
# Cable c, rail r uses subnet n = 2c-1+r (16 subnets); its port 0 end is host 1,
# its port 1 end host 2. On the Sparks, each subnet is its own /24 from your
# private range: the setup scripts accept only /24. The addresses below are
# documentation addresses, one /29 per rail (subnet n is 192.0.2.(8(n-1))/29)
# so that all 16 fit in one reserved range. Do not put them on your Sparks.
# Check the ring:    vade doctor --fabric --ring
# Start one server:  VADE_GROUP=eight vade up
[global]
engine_source = /path/to/vade/engine
harness_source = /path/to/vade/harness
cli_source = /path/to/vade/cli
stage_dir = /path/to/local/vade-bin
state_dir = ~/.vade-state
model = qwen3.8-flash-next-fp4-local
model_repo = nvidia/Qwen3.8-Flash-Next-FP4-Local
model_revision = b9ce18a6887e18c089fdea8509a33e63429a3300
local_port = 18080
serve_port = 18080
tp_port = 29960
health_timeout_secs = 360

[machine spark-1]
ssh = spark-1-ssh-alias
fabric.spark-2 = 192.0.2.1
fabric.spark-8 = 192.0.2.114
model_path = /home/your-user/models/nvidia/Qwen3.8-Flash-Next-FP4-Local

[machine spark-2]
ssh = spark-2-ssh-alias
fabric.spark-3 = 192.0.2.17
fabric.spark-1 = 192.0.2.2
model_path = /home/your-user/models/nvidia/Qwen3.8-Flash-Next-FP4-Local

[machine spark-3]
ssh = spark-3-ssh-alias
fabric.spark-4 = 192.0.2.33
fabric.spark-2 = 192.0.2.18
model_path = /home/your-user/models/nvidia/Qwen3.8-Flash-Next-FP4-Local

[machine spark-4]
ssh = spark-4-ssh-alias
fabric.spark-5 = 192.0.2.49
fabric.spark-3 = 192.0.2.34
model_path = /home/your-user/models/nvidia/Qwen3.8-Flash-Next-FP4-Local

[machine spark-5]
ssh = spark-5-ssh-alias
fabric.spark-6 = 192.0.2.65
fabric.spark-4 = 192.0.2.50
model_path = /home/your-user/models/nvidia/Qwen3.8-Flash-Next-FP4-Local

[machine spark-6]
ssh = spark-6-ssh-alias
fabric.spark-7 = 192.0.2.81
fabric.spark-5 = 192.0.2.66
model_path = /home/your-user/models/nvidia/Qwen3.8-Flash-Next-FP4-Local

[machine spark-7]
ssh = spark-7-ssh-alias
fabric.spark-8 = 192.0.2.97
fabric.spark-6 = 192.0.2.82
model_path = /home/your-user/models/nvidia/Qwen3.8-Flash-Next-FP4-Local

[machine spark-8]
ssh = spark-8-ssh-alias
fabric.spark-1 = 192.0.2.113
fabric.spark-7 = 192.0.2.98
model_path = /home/your-user/models/nvidia/Qwen3.8-Flash-Next-FP4-Local

# Every group is an arc of the ring: hosts follow the cables, each host is
# cabled to the next, and rank 0 (the first host, which answers HTTP) is the
# first Spark of the arc in cable order. Groups in one layout run at the same
# time; groups in different layouts may share machines. Each group is its own
# server on its own local_port: no gateway joins two groups.

# 8 of 8: the whole ring. The FP4-Local layer chain uses cables 1 to 7;
# cable 8 (spark-8 to spark-1) closes the ring.
[group eight]
hosts = spark-1,spark-2,spark-3,spark-4,spark-5,spark-6,spark-7,spark-8
local_port = 18080
layout = eight

# 2 quads, 4 of 8 each: two arcs of four. The FP4-Local layer chain of four
# uses three cables in each; cables 4 and 8 join the two arcs and stay idle.
# FP8 needs an FP8 config (vade up --fp8); its four-Spark token IDs differ
# from its two-Spark token IDs today.
# An arc that crosses cable 4 or 8 starts with --hosts, for example
# vade up --hosts spark-7,spark-8,spark-1,spark-2.
[group quad-a]
hosts = spark-1,spark-2,spark-3,spark-4
local_port = 18080
layout = quads

[group quad-b]
hosts = spark-5,spark-6,spark-7,spark-8
local_port = 18090
layout = quads

# 4 doubles: the pairs on cables 1, 3, 5 and 7 (tensor split), four servers on
# four local ports.
[group pair-1]
hosts = spark-1,spark-2
local_port = 18080
layout = doubles

[group pair-2]
hosts = spark-3,spark-4
local_port = 18083
layout = doubles

[group pair-3]
hosts = spark-5,spark-6
local_port = 18086
layout = doubles

[group pair-4]
hosts = spark-7,spark-8
local_port = 18089
layout = doubles

# The other 4 doubles: the pairs on cables 2, 4, 6 and 8. With both sets,
# every cable carries one tensor split.
[group pair-23]
hosts = spark-2,spark-3
local_port = 18080
layout = doubles-b

[group pair-45]
hosts = spark-4,spark-5
local_port = 18083
layout = doubles-b

[group pair-67]
hosts = spark-6,spark-7
local_port = 18086
layout = doubles-b

[group pair-81]
hosts = spark-8,spark-1
local_port = 18089
layout = doubles-b

# 8 singles: one group of one per Spark. Or, as one server behind a local
# gateway: vade up --replicas 8 (no group).

[group one-1]
hosts = spark-1
local_port = 18080
layout = singles

[group one-2]
hosts = spark-2
local_port = 18082
layout = singles

[group one-3]
hosts = spark-3
local_port = 18084
layout = singles

[group one-4]
hosts = spark-4
local_port = 18086
layout = singles

[group one-5]
hosts = spark-5
local_port = 18088
layout = singles

[group one-6]
hosts = spark-6
local_port = 18090
layout = singles

[group one-7]
hosts = spark-7
local_port = 18092
layout = singles

[group one-8]
hosts = spark-8
local_port = 18094
layout = singles
