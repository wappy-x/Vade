# Copy this file to your user config directory, or set VADE_CONFIG to its path.
# Legacy FP8 start: vade up --fp8-legacy
# Local relative paths are resolved beside this config. ~/ expands locally.
# Machine paths use that machine's home; fabric values never include a port.
# Remote engine_source holds paired engine/cli revision snapshots and engine cache.
# Remote cli_source holds the CLI compiler cache; published builds use stage_dir.
[global]
engine_source = /path/to/engine-source
harness_source = /path/to/harness-source
cli_source = /path/to/cli-source
stage_dir = /path/to/local/bin
state_dir = /path/to/local/state
model = qwen3.8-flash-next-fp8
model_repo = Qwen/Qwen3.8-Flash-Next-FP8
model_revision = 236dfdf285828023ca3bcd3f37366c58a3469b13
local_port = 18080
serve_port = 18080
tp_port = 29960
health_timeout_secs = 360
build_manifest = /path/to/local/state/build.conf

[machine machine-a]
ssh = machine-a-ssh-alias
# This machine's own address on its link to machine-b; a hostname or address.
fabric.machine-b = machine-a-fabric-address
model_path = ~/models/Qwen/Qwen3.8-Flash-Next-FP8
engine_source = ~/vade-source
cli_source = ~/vade-cli-source
stage_dir = ~/vade-stage
state_dir = ~/.local/state/vade

[machine machine-b]
ssh = machine-b-ssh-alias
fabric.machine-a = machine-b-fabric-address
model_path = ~/models/Qwen/Qwen3.8-Flash-Next-FP8
engine_source = ~/vade-source
cli_source = ~/vade-cli-source
stage_dir = ~/vade-stage
state_dir = ~/.local/state/vade

# For four or six machines, add sections and link entries in path order.
# List that order with vade up --hosts machine-a,machine-b,machine-c,machine-d.
