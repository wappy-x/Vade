# Eight FP4-Local Sparks, cabled as one ring of eight (option B in
# docs/eight-sparks.md). Copy it to a private file, replace every path and
# ssh destination, and set VADE_CONFIG to that file.
# fabric.<peer> is this Spark's own rail 0 address on the cable to <peer>.
# Cable c, rail r uses 192.0.2.(16(c-1)+8r)/29; its port 0 end is the first
# host. These are documentation addresses: use your own private range.
# Only spark-1, spark-4, spark-5 and spark-8 differ from eight-sparks.conf
# (two rings of four).
# Check the cables: vade doctor --fabric
# Start one server:  VADE_GROUP=eight vade up
[global]
engine_source = /path/to/vade/engine
harness_source = /path/to/vade/harness
cli_source = /path/to/vade/cli
stage_dir = /path/to/local/vade-bin
state_dir = ~/.vade-state
model = qwen3.8-flash-next-fp4-local
model_repo = nvidia/Qwen3.8-Flash-Next-FP4-Local
model_revision = b9ce18a6887e18c089fdea8509a33e63429a3300
local_port = 18080
serve_port = 18080
tp_port = 29960
health_timeout_secs = 360

[machine spark-1]
ssh = spark-1-ssh-alias
fabric.spark-2 = 192.0.2.1
fabric.spark-8 = 192.0.2.114
model_path = /home/your-user/models/nvidia/Qwen3.8-Flash-Next-FP4-Local

[machine spark-2]
ssh = spark-2-ssh-alias
fabric.spark-3 = 192.0.2.17
fabric.spark-1 = 192.0.2.2
model_path = /home/your-user/models/nvidia/Qwen3.8-Flash-Next-FP4-Local

[machine spark-3]
ssh = spark-3-ssh-alias
fabric.spark-4 = 192.0.2.33
fabric.spark-2 = 192.0.2.18
model_path = /home/your-user/models/nvidia/Qwen3.8-Flash-Next-FP4-Local

[machine spark-4]
ssh = spark-4-ssh-alias
fabric.spark-5 = 192.0.2.49
fabric.spark-3 = 192.0.2.34
model_path = /home/your-user/models/nvidia/Qwen3.8-Flash-Next-FP4-Local

[machine spark-5]
ssh = spark-5-ssh-alias
fabric.spark-6 = 192.0.2.65
fabric.spark-4 = 192.0.2.50
model_path = /home/your-user/models/nvidia/Qwen3.8-Flash-Next-FP4-Local

[machine spark-6]
ssh = spark-6-ssh-alias
fabric.spark-7 = 192.0.2.81
fabric.spark-5 = 192.0.2.66
model_path = /home/your-user/models/nvidia/Qwen3.8-Flash-Next-FP4-Local

[machine spark-7]
ssh = spark-7-ssh-alias
fabric.spark-8 = 192.0.2.97
fabric.spark-6 = 192.0.2.82
model_path = /home/your-user/models/nvidia/Qwen3.8-Flash-Next-FP4-Local

[machine spark-8]
ssh = spark-8-ssh-alias
fabric.spark-1 = 192.0.2.113
fabric.spark-7 = 192.0.2.98
model_path = /home/your-user/models/nvidia/Qwen3.8-Flash-Next-FP4-Local

# Three layouts at equal total load. Groups in one layout run at the same
# time; groups in different layouts may share machines. hosts is rank order.

# One group of eight: the FP4-Local layer chain over the whole ring.
# A ring of eight has no group of four that closes into a ring. To run one
# quad, use vade up --hosts spark-1,spark-2,spark-3,spark-4 without a group.
[group eight]
hosts = spark-1,spark-2,spark-3,spark-4,spark-5,spark-6,spark-7,spark-8
local_port = 18080
layout = eight

# 4 doubles: the pairs on cables 1, 3, 5 and 7 (tensor split).
[group pair-1]
hosts = spark-1,spark-2
local_port = 18080
layout = doubles

[group pair-2]
hosts = spark-3,spark-4
local_port = 18083
layout = doubles

[group pair-3]
hosts = spark-5,spark-6
local_port = 18086
layout = doubles

[group pair-4]
hosts = spark-7,spark-8
local_port = 18089
layout = doubles

# 8 singles: one group of one per Spark. Or, as one server behind a local
# gateway: vade up --replicas 8 (no group).

[group one-1]
hosts = spark-1
local_port = 18080
layout = singles

[group one-2]
hosts = spark-2
local_port = 18082
layout = singles

[group one-3]
hosts = spark-3
local_port = 18084
layout = singles

[group one-4]
hosts = spark-4
local_port = 18086
layout = singles

[group one-5]
hosts = spark-5
local_port = 18088
layout = singles

[group one-6]
hosts = spark-6
local_port = 18090
layout = singles

[group one-7]
hosts = spark-7
local_port = 18092
layout = singles

[group one-8]
hosts = spark-8
local_port = 18094
layout = singles
