# Two DGX Sparks running one FP4-Local engine as a two-stage layer pipeline.
# Copy this file somewhere private, then replace every ssh destination, link address and model path.
# /path/to/vade is replaced by this checkout when examples/two-sparks.sh makes its dry-run copy.
# Full guide: INSTALL.md, "Two and more Sparks".
[global]
engine_source = /path/to/vade/engine
harness_source = /path/to/vade/harness
cli_source = /path/to/vade/cli
stage_dir = /path/to/vade/.local/stage
state_dir = ~/.vade-state
model = qwen3.8-flash-next-fp4-local
model_repo = nvidia/Qwen3.8-Flash-Next-FP4-Local
model_revision = b9ce18a6887e18c089fdea8509a33e63429a3300
# local_port: the API on this computer (an SSH tunnel). serve_port: the API on the first Spark.
local_port = 18080
serve_port = 18080
# Transport between the Sparks uses tp_port and tp_port + 1 on both machines.
tp_port = 29960
health_timeout_secs = 360

# fabric.<peer> is this machine's own address on the cable toward <peer>.
[machine spark-a]
ssh = you@spark-a.example
fabric.spark-b = 192.0.2.1
model_path = /home/you/models/nvidia/Qwen3.8-Flash-Next-FP4-Local
engine_source = ~/vade-source
cli_source = ~/vade-cli-source
stage_dir = ~/vade-stage
state_dir = ~/.local/state/vade

[machine spark-b]
ssh = you@spark-b.example
fabric.spark-a = 192.0.2.2
model_path = /home/you/models/nvidia/Qwen3.8-Flash-Next-FP4-Local
engine_source = ~/vade-source
cli_source = ~/vade-cli-source
stage_dir = ~/vade-stage
state_dir = ~/.local/state/vade
