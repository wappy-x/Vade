name: Feature request
description: Suggest something Vade could do, or do better.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Vade uses Rust's standard library, with no third-party dependencies or Python. The same request must give identical token IDs across runs and Sparks. New arithmetic-order switches and model-specific tuning do not fit the project rules.

        Remove private data and connection details before you attach examples.
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The task or situation, and where Vade gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like Vade to do
      description: Describe the result you want. Include an example command or request if it helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
      description: Any workaround you use, or other approaches you considered.
  - type: input
    id: setup
    attributes:
      label: Your setup
      description: How many Sparks, and whether you run on the Spark or from a controller, if that matters here.
  - type: textarea
    id: proof
    attributes:
      label: How to check the result
      description: Describe a useful test. For an engine change, say how token IDs should match across runs, batching, caching, chunking and drafting modes.
