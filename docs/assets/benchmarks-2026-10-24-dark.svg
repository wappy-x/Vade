<text x="24.0" y="766.0" font-size="11" fill="#c3c2b7" text-anchor="start">Every bar is a RigMark card for Vade v0.1.0, thinking OFF, context 32768, greedy decoding.</text>
<text x="24.0" y="783.0" font-size="11" fill="#c3c2b7" text-anchor="start">Drafting is ON by default; for the OFF cards, every request sent "draft":"plain".</text>
<text x="24.0" y="800.0" font-size="11" fill="#c3c2b7" text-anchor="start">tok/s = completion tokens per wall second; 8 chats = eight concurrent chats, counted together.</text>
<text x="24.0" y="817.0" font-size="11" fill="#c3c2b7" text-anchor="start">8-chat rates vary: at eight chats the engine serves some chats without drafting.</text>
