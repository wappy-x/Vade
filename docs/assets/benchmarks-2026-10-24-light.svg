<title id="t">Vade v0.1.0 on one DGX Spark and on two, drafting ON, RigMark cards of 2026-10-24</title>
<desc id="d">A second Spark answers a long prompt faster. One chat does not write faster. With drafting ON (the default), one chat writes slower on two Sparks. Eight chats vary from run to run. Drafting ON, 1 Spark then 2 Sparks: code 76.7 and 65.1 tok/s, prose 41.7 and 38.3, 8 chats together 173.9 and 168.6; first reply after an 8K-token prompt 3.86 s and 2.79 s. Across all our runs, 8 chats gave 130.6 to 173.9 tok/s on six single Sparks and 167.6 to 168.7 on three pairs.</desc>
