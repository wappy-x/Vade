<text x="24.0" y="455.0" font-size="11" fill="#52514e" text-anchor="start">Each bar is one RigMark card for Vade v0.1.0 (5a22651), thinking OFF, context 32768, greedy decoding.</text>
<text x="24.0" y="472.0" font-size="11" fill="#52514e" text-anchor="start">Two Sparks run as a pipeline: each holds part of the model's layers and passes its work to the next.</text>
<text x="24.0" y="489.0" font-size="11" fill="#52514e" text-anchor="start">The headline holds on all six single Sparks and all three pairs we measured with these settings.</text>
<text x="24.0" y="506.0" font-size="11" fill="#52514e" text-anchor="start">Drafting OFF and the cloud VM runs are in the tables on the benchmarks page.</text>
